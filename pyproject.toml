[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syslogrouter"
version = "1.0.0"
description = "Parse RFC 5424 and RFC 3164 syslog, route events with ordered JSON rules, store them in SQLite and build a standalone HTML dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jeremy da Costa", email = "357285436+jeremydacosta-TechOptimist@users.noreply.github.com" },
]
keywords = ["syslog", "rfc5424", "rfc3164", "log-management", "network-operations", "sqlite", "routing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
syslogrouter = "syslogrouter.cli:main"

[project.urls]
Homepage = "https://github.com/jeremydacosta-TechOptimist/syslog-router"
Issues = "https://github.com/jeremydacosta-TechOptimist/syslog-router/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
